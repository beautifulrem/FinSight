# Template for the finsight-db Secret. Not part of kustomization.yaml, never commit a filled-in copy.
#
#   export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#   envsubst '$POSTGRES_PASSWORD' < deploy/k8s/secret.template.yaml | kubectl apply -f -
#
# Or create it directly (kubectl create secret generic ..., see finsight.yaml), or sync it from a secret
# manager with the External Secrets Operator (docs/deployment.md).
apiVersion: v1
kind: Secret
metadata:
  name: finsight-db
  namespace: finsight
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  QI_AGENT_CHECKPOINT_DB: "postgresql://postgres:${POSTGRES_PASSWORD}@finsight-postgres:5432/finsight"
