# Templates for the finsight-db and finsight-api-keys Secrets. Not part of kustomization.yaml, never commit a
# filled-in copy.
#
#   export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#   export QI_API_KEYS="$(openssl rand -hex 24)"            # comma-separated: one key per client, rotate by adding
#   export QI_ANON_COOKIE_SECRET="$(openssl rand -hex 32)"
#   envsubst '$POSTGRES_PASSWORD $QI_API_KEYS $QI_ANON_COOKIE_SECRET' < deploy/k8s/secret.template.yaml \
#     | kubectl apply -f -
#
# Or create it directly (kubectl create secret generic ..., see finsight.yaml), or sync it from a secret
# manager with the External Secrets Operator (docs/deployment.md).
apiVersion: v1
kind: Secret
metadata:
  name: finsight-db
  namespace: finsight
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  QI_AGENT_CHECKPOINT_DB: "postgresql://postgres:${POSTGRES_PASSWORD}@finsight-postgres:5432/finsight"
---
apiVersion: v1
kind: Secret
metadata:
  name: finsight-api-keys
  namespace: finsight
type: Opaque
stringData:
  QI_API_KEYS: "${QI_API_KEYS}"
  QI_ANON_COOKIE_SECRET: "${QI_ANON_COOKIE_SECRET}"
