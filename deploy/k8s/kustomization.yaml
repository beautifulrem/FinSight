# kubectl apply -k deploy/k8s
#
# Image tagging: images are tagged with the short commit hash they were built from, never a moving tag
# like :dev or :latest, so a running pod always names its source commit:
#
#   TAG=$(git rev-parse --short=7 HEAD)                      # build from a clean working tree
#   docker build -f docker/Dockerfile -t finsight:$TAG .     # or registry.example.com/finsight:$TAG
#   (cd deploy/k8s && kustomize edit set image finsight=finsight:$TAG)   # updates newTag below
#
# The tag below is set at release time, not on every commit: a commit cannot contain its own hash, so newTag
# names the last *released* image (built from a clean tree at that commit and smoke-tested: /ready, /agent/chat),
# which is usually a few commits behind HEAD. Releasing = the three commands above, the smoke test, then one commit
# "release: finsight:<tag>" that changes only this line. Every push is still built and deployed to a throwaway
# kind cluster as finsight:${GITHUB_SHA} by CI (jobs docker and k8s-smoke). See docs/deployment.md, "Image tags".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - finsight.yaml
  - networkpolicy.yaml
images:
  - name: finsight
    newTag: "edcb442"
