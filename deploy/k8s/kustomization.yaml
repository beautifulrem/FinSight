# Image tag policy (round 13, I18): the committed tag is the placeholder "set-at-deploy", never a commit hash.
# A committed hash goes stale on the next commit (a commit cannot contain its own hash), so the tag is set where
# the image is built, from the commit being deployed:
#
#   TAG=$(git rev-parse --short=7 HEAD)                      # build from a clean working tree
#   docker build -f docker/Dockerfile -t finsight:$TAG .     # or registry.example.com/finsight:$TAG
#   (cd deploy/k8s && kustomize edit set image finsight=finsight:$TAG)   # in the deploy checkout; do not commit
#   kubectl apply -k deploy/k8s
#
# Applying this directory unchanged names finsight:set-at-deploy, which no registry has: the pods fail with
# ImagePullBackOff instead of running an unknown build. CI renders it with finsight:<commit> (job kubernetes) and
# deploys every push to a throwaway kind cluster through deploy/k8s-smoke, which sets its own tag (smoke).
# See docs/deployment.md, "Image tags".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - finsight.yaml
  - networkpolicy.yaml
images:
  - name: finsight
    newTag: set-at-deploy
