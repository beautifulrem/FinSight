# Usage (from the repository root):
#   docker compose -f docker/docker-compose.yml up --build                    # API + agent
#   docker compose -f docker/docker-compose.yml --profile postgres up --build # + PostgreSQL retrieval
#   docker compose -f docker/docker-compose.yml --profile tracing up --build  # + Jaeger (OTLP traces)
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 \
#     docker compose -f docker/docker-compose.yml --profile monitoring up --build
#       # + Prometheus (alerts.yml loaded), Grafana with the FinSight dashboard, Jaeger
#       # Grafana http://127.0.0.1:${GRAFANA_PORT:-3300} (anonymous admin, local use only),
#       # Prometheus http://127.0.0.1:${PROMETHEUS_PORT:-9090}, Jaeger http://127.0.0.1:${JAEGER_PORT:-16686}
# Monitoring configs are copied into the images at build time (dockerfile_inline) instead of bind-mounted,
# so the profile also works where the Docker VM cannot see the checkout (colima, remote daemons).
name: finsight

services:
  app:
    image: "${FINSIGHT_IMAGE:-finsight:dev}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        WITH_TORCH: "${WITH_TORCH:-0}"
    ports:
      - "${FINSIGHT_PORT:-8000}:8000"
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      DEEPSEEK_THINKING_TYPE: "${DEEPSEEK_THINKING_TYPE:-}"
      DEEPSEEK_REASONING_EFFORT: "${DEEPSEEK_REASONING_EFFORT:-}"
      QI_LLM_FALLBACK_MODELS: "${QI_LLM_FALLBACK_MODELS:-}"
      QI_LLM_USD_CNY: "${QI_LLM_USD_CNY:-}"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN:-}"
      QI_USE_LIVE_MARKET: "${QI_USE_LIVE_MARKET:-true}"
      QI_USE_LIVE_MACRO: "${QI_USE_LIVE_MACRO:-true}"
      QI_USE_LIVE_NEWS: "${QI_USE_LIVE_NEWS:-true}"
      QI_USE_LIVE_ANNOUNCEMENT: "${QI_USE_LIVE_ANNOUNCEMENT:-true}"
      QI_API_KEYS: "${QI_API_KEYS:-}"
      QI_RATE_LIMIT_PER_MINUTE: "${QI_RATE_LIMIT_PER_MINUTE:-0}"
      QI_CORS_ORIGINS: "${QI_CORS_ORIGINS:-}"
      QI_POSTGRES_DSN: "${QI_POSTGRES_DSN:-}"
      QI_USE_POSTGRES_RETRIEVAL: "${QI_USE_POSTGRES_RETRIEVAL:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      # Optional egress proxy for live data and the LLM gateway (e.g. colima: http://192.168.5.2:<port>).
      HTTPS_PROXY: "${FINSIGHT_EGRESS_PROXY:-}"
      HTTP_PROXY: "${FINSIGHT_EGRESS_PROXY:-}"
      NO_PROXY: "localhost,127.0.0.1,jaeger,prometheus,grafana,postgres"
    volumes:
      - finsight-outputs:/app/outputs
      - finsight-state:/app/state
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-finsight}"
      POSTGRES_DB: finsight
    volumes:
      - ../sql/qi_schema.sql:/docker-entrypoint-initdb.d/01_qi_schema.sql:ro
      - finsight-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing", "monitoring"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"

  prometheus:
    profiles: ["monitoring"]
    build:
      context: ../monitoring/prometheus
      dockerfile_inline: |
        FROM prom/prometheus:v3.15.0
        COPY prometheus.yml alerts.yml /etc/prometheus/
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [app]

  grafana:
    profiles: ["monitoring"]
    build:
      context: ../monitoring/grafana
      dockerfile_inline: |
        FROM grafana/grafana:13.2.2
        COPY provisioning /etc/grafana/provisioning
        COPY finsight-dashboard.json /var/lib/grafana/dashboards/finsight-dashboard.json
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/finsight-dashboard.json
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus]

volumes:
  finsight-outputs:
  finsight-state:
  finsight-pg:
