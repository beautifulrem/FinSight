# Lint scope is limited to the agent layer and its evaluation/tests.
# Legacy modules are not linted yet to avoid unrelated churn.
target-version = "py313"
line-length = 120
extend-exclude = ["evaluation/agent_eval/independent", "evaluation/heldout_r4", "evaluation/heldout_r5", "evaluation/heldout_r6", "evaluation/heldout_r7"]
include = [
    "query_intelligence/agent/**/*.py",
    "evaluation/agent_eval/**/*.py",
    "tests/test_agent_*.py",
    "tests/agent_fakes.py",
    "tests/test_api_security.py",
    "tests/test_web_ui.py",
    "scripts/export_agent_schemas.py",
    "query_intelligence/api/security.py",
    "query_intelligence/api/readiness.py",
    "query_intelligence/api/rate_limit.py",
    "query_intelligence/text_safety.py",
    "query_intelligence/api/rate_limit.py",
    "tests/test_rate_limit*.py",
    "tests/test_agent_injection_classifier.py",
    "training/injection_classifier/*.py",
    "tests/test_text_safety.py",
    "tests/test_rate_limit*.py",
    "training/injection_classifier/*.py",
    "tests/test_api_readiness.py",
    "query_intelligence/chat/**/*.py",
    "query_intelligence/chatbot.py",
    "query_intelligence/integrations/sources/**/*.py",
    "query_intelligence/integrations/ops_metrics.py",
    "query_intelligence/integrations/akshare_market_provider.py",
    "scripts/load_test.py",
    "scripts/measure_container_startup.py",
    "scripts/chaos_*.py",
    "monitoring/**/*.py",
    "tests/test_source_reliability.py",
    "tests/test_ops_scripts.py",
    "evaluation/human/**/*.py",
    "tests/test_human_kit.py",
]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Chinese text legitimately contains full-width punctuation.
ignore = ["RUF001", "RUF002", "RUF003"]
