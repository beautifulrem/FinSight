# gitleaks configuration: the built-in rules plus three narrowly scoped exceptions.
#
#   gitleaks git --redact -v .          # full history (what CI runs)
#   gitleaks git --redact --staged .    # staged changes (what the pre-commit hook runs)
#
# Do not add path wildcards here. A new finding is either a real secret (revoke it, remove it) or a
# false positive that gets an exception as narrow as the ones below. `gitleaks git` scans every ref it can
# see; CI checks out all branches (fetch-depth: 0).

title = "FinSight gitleaks config"

[extend]
useDefault = true

# The one real historical leak. An LLM API key was committed to config/app_config.json in 25cac09
# (2026-05-02) and removed seven minutes later in df385ba. The key was treated as compromised and
# revoked at the provider (see SECURITY.md). This exception matches only that commit AND that file AND
# that rule (fingerprint 25cac09561ad376d27595a3b4882658514da1150:config/app_config.json:generic-api-key:15);
# a secret in any other commit, file or rule still fails the scan.
[[allowlists]]
description = "Revoked key in 25cac09, removed in df385ba"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["25cac09561ad376d27595a3b4882658514da1150"]
paths = ['''^config/app_config\.json$''']

# False positive: generic-api-key reads the public Hugging Face model id in
# `tokenizer="ProsusAI/finbert"` (README.md / README_CN.md, commit 7babec7) as a token value.
[[allowlists]]
description = "Hugging Face model id ProsusAI/finbert after tokenizer= is not a secret"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^tokenizer\s*=\s*"ProsusAI/finbert"$''']

# False positive: the audit-log docstring example `"principal": "key:3b7e0a51c2d4"` (query_intelligence/
# agent/audit.py, branch r3-protocols) is the 12-hex-digit SHA-256 prefix the API logs instead of a key.
[[allowlists]]
description = "Hashed caller id (key:<12 hex>) in the audit-log format example is not a secret"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''"principal": "key:[0-9a-f]{12}"''']
