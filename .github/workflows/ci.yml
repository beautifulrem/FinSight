name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI is deterministic: every live market/news/announcement/macro provider is disabled.
  QI_USE_LIVE_MARKET: "false"
  QI_USE_LIVE_MACRO: "false"
  QI_USE_LIVE_NEWS: "false"
  QI_USE_LIVE_ANNOUNCEMENT: "false"
  QI_AGENT_TRACE_DIR: "off"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.13,<1"
      - run: ruff check .
      - run: ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Committed build matches the source
        working-directory: .
        run: |
          git status --porcelain query_intelligence/web/dist
          test -z "$(git status --porcelain query_intelligence/web/dist)" \
            || { echo "::error::query_intelligence/web/dist is stale; run 'pnpm build' in frontend/ and commit it"; exit 1; }

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: finsight
          POSTGRES_DB: finsight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # enables tests/test_agent_checkpoint_postgres.py (sessions shared by two replicas)
      QI_TEST_POSTGRES_DSN: postgresql://postgres:finsight@127.0.0.1:5432/finsight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3"
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Agent tests
        run: python -m pytest -q tests/test_agent_*.py tests/test_api_security.py tests/test_web_ui.py
      - name: Full test suite
        run: python -m pytest -q tests

  agent-eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (without torch)
        run: |
          grep -vE '^(torch|transformers|accelerate|sentencepiece)' requirements.txt > requirements-core.txt
          pip install -r requirements-core.txt
      - name: Replay the agent evaluation and enforce thresholds
        run: python -m evaluation.agent_eval.gate
      - name: Verifier false-accept and offline red-team thresholds
        run: |
          python -m evaluation.agent_eval.verifier_stress
          python -m evaluation.agent_eval.redteam
          python - <<'PY'
          import json
          stress = json.load(open("outputs/agent_eval/verifier_stress.json"))
          redteam = json.load(open("outputs/agent_eval/redteam.json"))
          assert stress["true_accept"]["claim"] == 1.0, stress["true_accept"]
          assert stress["false_accept"]["claim"] <= 0.05, stress["false_accept"]
          assert all(path["attack_success"] == 0 for path in redteam["paths"]), [p["attack_success"] for p in redteam["paths"]]
          print("verifier and red-team thresholds passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval
          path: outputs/agent_eval/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: finsight:ci
      - name: Smoke test the container
        run: |
          docker run -d --name finsight -p 8000:8000 -e QI_USE_LIVE_MARKET=0 -e QI_USE_LIVE_NEWS=0 \
            -e QI_USE_LIVE_ANNOUNCEMENT=0 -e QI_USE_LIVE_MACRO=0 finsight:ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break; sleep 5; done
          curl -fsS -X POST http://127.0.0.1:8000/agent/chat -H 'Content-Type: application/json' \
            -d '{"query":"贵州茅台的市盈率是多少","mode":"workflow"}' | python -c \
            "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok' and d['verification']['passed'], d"
          curl -fsS http://127.0.0.1:8000/.well-known/agent-card.json > /dev/null
          curl -fsS http://127.0.0.1:8000/metrics | grep -q finsight_agent_runs_total

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/k8s/finsight.yaml
