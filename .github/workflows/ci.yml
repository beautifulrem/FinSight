name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI is deterministic: every live market/news/announcement/macro provider is disabled.
  QI_USE_LIVE_MARKET: "false"
  QI_USE_LIVE_MACRO: "false"
  QI_USE_LIVE_NEWS: "false"
  QI_USE_LIVE_ANNOUNCEMENT: "false"
  QI_AGENT_TRACE_DIR: "off"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.13,<1"
      - run: ruff check .
      - run: ruff format --check query_intelligence/agent evaluation/agent_eval

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3"
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Agent tests
        run: python -m pytest -q tests/test_agent_*.py tests/test_api_security.py tests/test_web_ui.py
      - name: Full test suite
        run: python -m pytest -q tests

  agent-eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (without torch)
        run: |
          grep -vE '^(torch|transformers|accelerate|sentencepiece)' requirements.txt > requirements-core.txt
          pip install -r requirements-core.txt
      - name: Replay the agent evaluation and enforce thresholds
        run: python -m evaluation.agent_eval.gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval
          path: outputs/agent_eval/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: finsight:ci
