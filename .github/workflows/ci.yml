name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI is deterministic: every live market/news/announcement/macro provider is disabled.
  QI_USE_LIVE_MARKET: "false"
  QI_USE_LIVE_MACRO: "false"
  QI_USE_LIVE_NEWS: "false"
  QI_USE_LIVE_ANNOUNCEMENT: "false"
  QI_AGENT_TRACE_DIR: "off"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    # (round 17, round-13 review M17) ruff takes seconds (13 s in run 38113129617); without a limit a hung runner
    # would hold the job for GitHub's default 360 min
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.9"  # same version as .pre-commit-config.yaml
      - run: ruff check .
      - run: ruff format --check .

  secrets:
    # Full-history secret scan. .gitleaks.toml exempts exactly one historical finding (the revoked key in
    # 302077a, see SECURITY.md) and two content-matched false positives; anything else fails the build.
    # Takes under a minute on the hosted runner (42 s for 410 commits in run 36761702426); the timeout leaves
    # room for the single 46 MB commit of data/runtime/documents.jsonl on a slow runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
      - name: Scan every commit
        run: |
          ./gitleaks git --config .gitleaks.toml --redact --verbose --no-banner \
            --report-format sarif --report-path gitleaks.sarif .
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          # There is no package.json at the repository root; the pnpm version comes from packageManager here.
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Committed build matches the source
        working-directory: .
        run: |
          git status --porcelain query_intelligence/web/dist
          test -z "$(git status --porcelain query_intelligence/web/dist)" \
            || { echo "::error::query_intelligence/web/dist is stale; run 'pnpm build' in frontend/ and commit it"; exit 1; }

  tests:
    # (round 16) 120 min: run 38095861905 took 47 of the previous 60 (pytest with coverage 44 min) with 3,721 tests; the
    # suite has 4,397 since, and the pre-push estimate at 2181568 was 56.9 min (63% of 90). scripts/prepush.sh fails a
    # step whose job's estimated CI time exceeds 60% of its timeout-minutes (scripts/ci_budget.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: finsight
          POSTGRES_DB: finsight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # enables tests/test_agent_checkpoint_postgres.py (sessions shared by two replicas)
      QI_TEST_POSTGRES_DSN: postgresql://postgres:finsight@127.0.0.1:5432/finsight
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3"
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      # axe-core for the accessibility tests in tests/test_web_ui.py comes from frontend/node_modules
      # (pinned in pnpm-lock.yaml). Under CI=true those tests fail instead of skipping when it is missing.
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies (axe-core)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # @a2a-js/sdk for tests/test_a2a_js_interop.py (A2A interop with the official JS SDK client); under CI=true
      # that test fails instead of skipping when the client is not installed.
      - name: Install the A2A JavaScript interop client
        working-directory: tools/a2a-js-client
        run: npm ci --no-audit --no-fund
      - name: Full test suite with branch coverage (run once)
        # Pass a directory, not a dotted package: --cov=query_intelligence.agent imports it before the test
        # session and breaks scikit-learn's compiled modules.
        run: python -m pytest -q tests --cov=query_intelligence --cov-branch --cov-report=
      - name: Coverage floors (statements + branches)
        # Measured on the full suite: agent 90.17%, api 92.13%, answer_guards.py 83.74%
        # (docs/results/coverage/coverage-ef07a7f.json); each floor sits about 2 points below.
        run: |
          set -o pipefail
          check() {
            echo "### Coverage: $1 (floor $2%)" >> "$GITHUB_STEP_SUMMARY"
            coverage report --include="$1" --skip-covered --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
            coverage report --include="$1" --fail-under="$2" --format=total
          }
          check 'query_intelligence/agent/*' 88
          check 'query_intelligence/api/*' 90
          check 'query_intelligence/answer_guards.py' 81
      # (round 12) Real Chrome (preinstalled on the runner) against the offline server that
      # frontend/playwright.config.ts starts on port 8905: a three-turn zh gap session with its two citations,
      # and a fact-check with a stated industry average. It drives the committed build, which the frontend job
      # checks against the source. About 2 minutes, most of it the server loading its models.
      - name: Browser regression tests (Playwright)
        working-directory: frontend
        env:
          FINSIGHT_PYTHON: python
        run: pnpm run e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  tests-shipped:
    # (round 17, round-13 review M17) the suite again on what the product serves by default: tests/conftest.py pins
    # the v1 seed unless QI_TEST_SHIPPED_DEFAULT=1, which turns the snapshot extension and the corrections layer on and
    # deselects the tests listed in tests/seed_data_tests.txt (they assert seed values). No coverage; its own job so
    # the tests job keeps its time budget (scripts/ci_budget.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3"
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies (axe-core)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install the A2A JavaScript interop client
        working-directory: tools/a2a-js-client
        run: npm ci --no-audit --no-fund
      - name: Full test suite on the shipped default data (extension and corrections on)
        run: QI_TEST_SHIPPED_DEFAULT=1 python -m pytest -q tests

  agent-eval-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (without torch)
        run: |
          grep -vE '^(torch|transformers|accelerate|sentencepiece)' requirements.txt > requirements-core.txt
          pip install -r requirements-core.txt
      - name: Replay the agent evaluation against floors and committed baselines (evaluation/results/gate-*.json)
        # dev and holdout are pinned to the v1 snapshot (their labels include v1 absences)
        run: python -m evaluation.agent_eval.gate --set dev --set holdout
      - name: The shipped default (snapshot extension on) against its floor and baseline (gate-ext.json)
        # tasks/agent_eval_ext_v1.jsonl run against the offline tools directly, no replay fixture; the gate sets
        # QI_EVAL_SNAPSHOT_EXT=1 for this set itself, the env below only makes it visible in the log
        env:
          QI_EVAL_SNAPSHOT_EXT: "1"
        run: python -m evaluation.agent_eval.gate --set ext
      - name: What the product serves by default (extension AND corrections layer on) against gate-shipped.json
        # (round-10 review J1) tasks/agent_eval_shipped_v1.jsonl: expected values from
        # data/snapshot/structured_data_fix.json, seed values forbidden; with the corrections layer off it scores
        # 2/21. The gate sets both variables for this set itself; the env below only makes them visible in the log.
        env:
          QI_EVAL_SNAPSHOT_EXT: "1"
          QI_EVAL_SNAPSHOT_FIX: "1"
        run: python -m evaluation.agent_eval.gate --set shipped
      - name: Held-out claim check against its floor (a regression below the HEAD accuracy fails)
        # evaluation/claim_bench/claims_v1_holdout.jsonl: 47 claims / 54 checks. Floors = accuracy at the time the
        # step was added (verdict 46/47, see docs/agent-eval.md); one more wrong verdict fails the build.
        run: |
          python -m evaluation.claim_bench.run --set holdout --out outputs/agent_eval/claim_bench-holdout.json \
            --fail-under-verdict 0.978 --fail-under-checks 0.98
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-eval
          path: outputs/agent_eval/

  agent-eval-extras:
    # (round 16) the verifier stress test and the offline red team, split from agent-eval-gate: together they took
    # 29 of that job's 45 min in run 38095861905 (the job used 40 min before its verify step); scripts/ci_budget.py
    # keeps each job's estimated time under 60% of its timeout-minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (without torch)
        run: |
          grep -vE '^(torch|transformers|accelerate|sentencepiece)' requirements.txt > requirements-core.txt
          pip install -r requirements-core.txt
      - name: Verifier false-accept and offline red team against committed baselines
        run: |
          python -m evaluation.agent_eval.verifier_stress
          python -m evaluation.agent_eval.redteam
          python -m evaluation.agent_eval.gate --extras-only
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-eval-extras
          path: outputs/agent_eval/

  heldout-verify:
    # (round 15) the slice verify scripts and the report check, split from agent-eval-gate so that job stays under
    # its timeout (run 38095861905 was cancelled at 45 min inside the verify step after the r10/r11 slices were added)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (without torch)
        run: |
          grep -vE '^(torch|transformers|accelerate|sentencepiece)' requirements.txt > requirements-core.txt
          pip install -r requirements-core.txt
      - name: Independent held-out slices still match the offline tools (verify scripts)
        env:
          PYTHONPATH: .
        run: |
          python evaluation/agent_eval/independent/verify_multiturn.py
          python evaluation/agent_eval/independent/verify_test_v3.py
          python evaluation/heldout_r4/verify_heldout_r4.py
          python evaluation/heldout_r5/verify_heldout_r5.py
          python evaluation/heldout_r6/verify_heldout_r6.py
          python evaluation/heldout_r7/verify_heldout_r7.py
          python evaluation/heldout_r8/verify_heldout_r8.py
          QI_EVAL_SNAPSHOT_EXT=1 python evaluation/heldout_r9/verify_heldout_r9.py
          QI_EVAL_SNAPSHOT_EXT=1 QI_EVAL_SNAPSHOT_FIX=1 python evaluation/heldout_r10/verify_heldout_r10.py
          QI_EVAL_SNAPSHOT_EXT=1 QI_EVAL_SNAPSHOT_FIX=1 python evaluation/heldout_r11/verify_heldout_r11.py
          QI_EVAL_SNAPSHOT_EXT=1 QI_EVAL_SNAPSHOT_FIX=1 python evaluation/heldout_r12/verify_heldout_r12.py
      - name: docs/agent-eval.md and the generated README regions match the committed results
        # (round 17, round-13 review M14) the README headline numbers are rendered by evaluation/agent_eval/readme.py
        run: python -m evaluation.agent_eval.report --check

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          # Images are tagged with the commit they were built from (see deploy/k8s/kustomization.yaml).
          tags: finsight:ci,finsight:${{ github.sha }}
      - name: Smoke test the container (read-only root filesystem, non-root, as in Kubernetes)
        run: |
          docker run -d --name finsight -p 8000:8000 --read-only \
            --tmpfs /tmp --tmpfs /app/state:uid=10001 --tmpfs /app/outputs:uid=10001 \
            -e QI_USE_LIVE_MARKET=0 -e QI_USE_LIVE_NEWS=0 -e QI_USE_LIVE_ANNOUNCEMENT=0 -e QI_USE_LIVE_MACRO=0 \
            "finsight:${{ github.sha }}"
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/ready; then ready=1; break; fi
            sleep 5
          done
          echo
          if [ "$ready" != 1 ]; then docker logs finsight | tail -50; exit 1; fi
          curl -fsS http://127.0.0.1:8000/health
          # (round-10 review J2) the image ships every offline data layer it switches on: /ready lists them and
          # the answers carry the corrected FY2025 figures (茅台 P/E 21.44, not the v1 seed's 24.6; 五粮液 ROE（加权）
          # 6.89% and 营业收入 405.29 亿元, not 29.4% / 1,085 亿元)
          curl -fsS http://127.0.0.1:8000/ready | python3 -c \
            "import sys,json; c=json.load(sys.stdin)['checks']['data_layers']; print(c['loaded']); \
            assert c['loaded']==['seed_v1','extension','corrections'], c"
          curl -fsS -X POST http://127.0.0.1:8000/agent/chat -H 'Content-Type: application/json' \
            -d '{"query":"贵州茅台的市盈率是多少","mode":"workflow"}' | python3 -c \
            "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok' and d['verification']['passed'], d; \
            assert 'PE(TTM) 21.44 倍' in d['answer'], d['answer']"
          curl -fsS -X POST http://127.0.0.1:8000/agent/chat -H 'Content-Type: application/json' \
            -d '{"query":"五粮液2025年的加权ROE是多少","mode":"workflow"}' | python3 -c \
            "import sys,json; d=json.load(sys.stdin); a=d['answer']; print(a); assert d['verification']['passed'], d; \
            assert 'ROE（加权） 6.89%' in a and '营业收入 405.29 亿元' in a, a"
          curl -fsS http://127.0.0.1:8000/.well-known/agent-card.json > /dev/null
          curl -fsS http://127.0.0.1:8000/metrics | grep -q finsight_agent_runs_total
      - name: A root-owned state volume makes the container unready but still alive (B22)
        run: |
          docker run -d --name finsight-bad-state -p 8001:8000 --read-only --tmpfs /tmp \
            --tmpfs /app/state:uid=0,mode=0755 --tmpfs /app/outputs:uid=10001 \
            -e QI_USE_LIVE_MARKET=0 -e QI_USE_LIVE_NEWS=0 -e QI_USE_LIVE_ANNOUNCEMENT=0 -e QI_USE_LIVE_MACRO=0 \
            "finsight:${{ github.sha }}"
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:8001/health && break; sleep 5; done
          echo
          code=$(curl -s -o ready.json -w '%{http_code}' http://127.0.0.1:8001/ready)
          cat ready.json; echo
          test "$code" = 503
          python3 -c "import json; c=json.load(open('ready.json'))['checks']; assert not c['checkpointer']['ok'], c"

  k8s-smoke:
    # Applies the real kustomization (through the deploy/k8s-smoke overlay: 1 replica, offline data) to a
    # throwaway kind cluster and waits for the API's readinessProbe (GET /ready: Postgres checkpointer, model
    # config, retrieval index), then checks /ready and one verified /agent/chat answer from a pod the
    # NetworkPolicy admits. kindnetd enforces NetworkPolicy, so the policies are exercised too.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KIND_VERSION: 0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@v5
      - name: Install kind (pinned, checksum verified)
        run: |
          curl -sSfL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: finsight:${{ github.sha }}
      - name: Apply deploy/k8s-smoke to kind and wait for /ready
        run: IMAGE="finsight:${{ github.sha }}" deploy/k8s-smoke/smoke.sh

  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: 0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform (pinned, checksum verified)
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform && rm kubeconform.tar.gz
      - name: The committed image tag is the deploy-time placeholder (docs/deployment.md, "Image tags")
        run: |
          committed=$(kubectl kustomize deploy/k8s | grep -E '^\s+image: finsight')
          echo "$committed"
          echo "$committed" | grep -Eq 'image: finsight:set-at-deploy$' \
            || { echo "::error::deploy/k8s must keep newTag: set-at-deploy; the tag is set at deploy time"; exit 1; }
      - name: Render deploy/k8s as a deploy would (tag = this commit) and validate it with the secret template
        run: |
          # an overlay outside the committed tree, the same mechanism as deploy/k8s-smoke
          mkdir -p deploy/.ci-release
          printf '%s\n' 'apiVersion: kustomize.config.k8s.io/v1beta1' 'kind: Kustomization' 'resources:' '  - ../k8s' \
            'images:' '  - name: finsight' "    newTag: \"${GITHUB_SHA::7}\"" > deploy/.ci-release/kustomization.yaml
          kubectl kustomize deploy/.ci-release > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml deploy/k8s/secret.template.yaml
      - name: No committed Secret, and a commit-tagged image
        run: |
          if grep -q '^kind: Secret' rendered.yaml; then echo "::error::deploy/k8s must not render a Secret"; exit 1; fi
          image=$(grep -E '^\s+image: finsight' rendered.yaml)
          echo "$image"
          echo "$image" | grep -Eq "finsight:${GITHUB_SHA::7}$" \
            || { echo "::error::the rendered finsight image must be tagged with this commit"; exit 1; }
