# promtool unit tests for the quality/security rules (see docs/a2a-and-observability.md):
#   promtool test rules monitoring/prometheus/alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # v3: 2 of every 5 LLM answers need deterministic repair (40% > 25%); v2 is healthy (1 in 10).
      - series: 'finsight_answer_verification_total{prompt_version="v3",outcome="repaired"}'
        values: '0+2x90'
      - series: 'finsight_answer_verification_total{prompt_version="v3",outcome="passed"}'
        values: '0+3x90'
      - series: 'finsight_answer_verification_total{prompt_version="v2",outcome="repaired"}'
        values: '0+1x90'
      - series: 'finsight_answer_verification_total{prompt_version="v2",outcome="passed"}'
        values: '0+9x90'
      # Template answers never alert on repair rate.
      - series: 'finsight_answer_verification_total{prompt_version="none",outcome="repaired"}'
        values: '0+5x90'
      # 3 injection refusals per minute: 30 per 10 minutes.
      - series: 'finsight_audit_events_total{event="refusal",category="prompt_injection"}'
        values: '0+3x90'
      # Feedback: 2 down and 1 up per 10 minutes.
      - series: 'finsight_feedback_total{rating="down",prompt_version="v3"}'
        values: '0+0.2x400'
      - series: 'finsight_feedback_total{rating="up",prompt_version="v3"}'
        values: '0+0.1x400'
    alert_rule_test:
      - eval_time: 75m
        alertname: FinSightRepairRateHighForPromptVersion
        exp_alerts:
          - exp_labels: {severity: warning, prompt_version: v3}
            exp_annotations:
              summary: "Prompt v3: more than 25% of LLM answers need deterministic repair"
              description: "Repaired answers lose the sentences that failed verification. A rise right after a prompt or model change points at that change; compare versions on the dashboard."
      - eval_time: 20m
        alertname: FinSightInjectionAttemptsSpike
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: "30 prompt-injection refusals in 10 minutes"
              description: "Group the audit log (outputs/audit/audit.jsonl) by principal and query_hash to see whether one caller is probing the guard."
      - eval_time: 390m
        alertname: FinSightNegativeFeedbackHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "More than half of the last 6 h of user ratings are thumbs-down"
              description: "Run scripts/feedback_to_tasks.py on the feedback log to turn the flagged traces into evaluation tasks."

  # Output-safety edits per answer (round 12): 0.8 per answer fires; 0.2 per answer (the second test) does not.
  - interval: 1m
    input_series:
      - series: 'finsight_agent_runs_total{route="workflow",answer_source="template"}'
        values: '0+1x150'
      - series: 'finsight_agent_runs_total{route="refuse",answer_source="refusal"}'
        values: '0+5x150'
      - series: 'finsight_output_safety_edits_total{kind="attribution"}'
        values: '0+0.6x150'
      - series: 'finsight_output_safety_edits_total{kind="promotion_or_contact"}'
        values: '0+0.2x150'
    alert_rule_test:
      - eval_time: 40m  # pending: 20 answers in the hour since 20m, not yet 30 minutes above 0.5
        alertname: FinSightOutputSafetyEditRateHigh
        exp_alerts: []
      - eval_time: 120m
        alertname: FinSightOutputSafetyEditRateHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Output-safety layer edits 0.80 times per answer"
              description: "Look at the trace compliance notes (attributed_document_claim, omitted_*) of recent runs: a poisoned source, or a layer change that marks figures the fundamentals confirm."

  - interval: 1m
    input_series:
      - series: 'finsight_agent_runs_total{route="agent",answer_source="llm_agent"}'
        values: '0+1x150'
      - series: 'finsight_output_safety_edits_total{kind="attribution"}'
        values: '0+0.2x150'
    alert_rule_test:
      - eval_time: 150m
        alertname: FinSightOutputSafetyEditRateHigh
        exp_alerts: []
