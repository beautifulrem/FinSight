# Alert rules for FinSight. Metric sources:
#   trace-fed (agent/telemetry.py): finsight_agent_run_seconds, finsight_agent_runs_total,
#     finsight_verification_failures_total, finsight_degradations_total, finsight_tool_calls_total,
#     finsight_llm_cost_total, finsight_answer_verification_total, finsight_feedback_total
#   audit (agent/audit.py): finsight_audit_events_total
#   scrape-time (integrations/ops_metrics.py): finsight_llm_circuit_state, finsight_source_circuit_state,
#     finsight_source_pool_*
# Thresholds come from the measurements in docs/performance.md (workflow P95 is below 1 s at one user
# and about 8 s at 32 concurrent users on one process; agent P95 is tens of seconds).
groups:
  - name: finsight-availability
    rules:
      - alert: FinSightDown
        expr: up{job="finsight"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "FinSight API is not answering /metrics"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 1 minute."

  - name: finsight-latency-quality
    rules:
      - alert: FinSightWorkflowP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(finsight_agent_run_seconds_bucket{route="workflow"}[5m]))) > 8
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Workflow-route P95 above 8 s for 10 minutes"
          description: "P95 is {{ $value | humanizeDuration }}. One process saturates at about 6-7 req/s; scale out (HPA) or check the checkpointer."
      - alert: FinSightAgentP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(finsight_agent_run_seconds_bucket{route="agent"}[10m]))) > 60
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Agent-route P95 above 60 s"
          description: "P95 is {{ $value | humanizeDuration }}; usually the LLM provider. Check finsight_llm_circuit_state and gateway latency."
      - alert: FinSightVerificationFailureRateHigh
        expr: |
          sum(rate(finsight_verification_failures_total[15m]))
            / clamp_min(sum(rate(finsight_agent_runs_total{route=~"workflow|agent"}[15m])), 1e-9) > 0.2
          and sum(rate(finsight_agent_runs_total{route=~"workflow|agent"}[15m])) > 0.01
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "More than 20% of drafts fail citation/number verification"
          description: "Drafts are repaired before answering, but a sustained rise means a prompt, model or data regression."
      - alert: FinSightToolErrorRateHigh
        expr: |
          sum by (tool) (rate(finsight_tool_calls_total{outcome="error"}[10m]))
            / clamp_min(sum by (tool) (rate(finsight_tool_calls_total[10m])), 1e-9) > 0.25
          and sum by (tool) (rate(finsight_tool_calls_total[10m])) > 0.005
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Tool {{ $labels.tool }} fails more than 25% of calls"

  - name: finsight-dependencies
    rules:
      - alert: FinSightLLMModelCircuitOpen
        expr: max by (model) (finsight_llm_circuit_state) >= 2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "LLM model {{ $labels.model }} is circuit-open; traffic is on the fallback model"
          description: "FallbackLLM opened the breaker after 3 consecutive failures. Answers continue on the next model; check the provider."
      - alert: FinSightAllLLMModelsDown
        expr: min(finsight_llm_circuit_state) >= 2
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Every configured LLM model is circuit-open"
          description: "The agent degrades to the deterministic planner and template answers (degraded=llm_error)."
      - alert: FinSightDataSourceCircuitOpen
        expr: finsight_source_circuit_state == 2
        for: 10m
        labels: {severity: info}
        annotations:
          summary: "Live data source {{ $labels.source }} circuit-open for 10 minutes"
          description: "Queries fall back to the next source, the last-known-good cache or the labelled snapshot."
      - alert: FinSightSourcePoolAbandonedCalls
        expr: finsight_source_pool_abandoned_running >= 8
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} hung upstream calls are holding source-pool workers"
          description: "Calls past QI_SOURCE_CALL_TIMEOUT_SECONDS keep a worker until the socket gives up; at QI_SOURCE_MAX_WORKERS new calls are rejected."

  - name: finsight-cost
    rules:
      - alert: FinSightLLMCostBurnHigh
        expr: sum(increase(finsight_llm_cost_total{currency="CNY"}[1h])) > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "LLM spend above 20 CNY in the last hour"
          description: "At the measured cost per agent question this is several thousand agent runs per hour; check for abuse or a loop."

  - name: finsight-quality-security
    rules:
      - alert: FinSightRepairRateHighForPromptVersion
        expr: |
          sum by (prompt_version) (rate(finsight_answer_verification_total{outcome="repaired",prompt_version!="none"}[30m]))
            / clamp_min(sum by (prompt_version) (rate(finsight_answer_verification_total{prompt_version!="none"}[30m])), 1e-9) > 0.25
          and sum by (prompt_version) (increase(finsight_answer_verification_total{prompt_version!="none"}[30m])) >= 20
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Prompt {{ $labels.prompt_version }}: more than 25% of LLM answers need deterministic repair"
          description: "Repaired answers lose the sentences that failed verification. A rise right after a prompt or model change points at that change; compare versions on the dashboard."
      - alert: FinSightNegativeFeedbackHigh
        expr: |
          sum(increase(finsight_feedback_total{rating="down"}[6h])) / clamp_min(sum(increase(finsight_feedback_total[6h])), 1e-9) > 0.5
          and sum(increase(finsight_feedback_total[6h])) >= 10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "More than half of the last 6 h of user ratings are thumbs-down"
          description: "Run scripts/feedback_to_tasks.py on the feedback log to turn the flagged traces into evaluation tasks."
      - alert: FinSightInjectionAttemptsSpike
        expr: sum(increase(finsight_audit_events_total{event="refusal",category="prompt_injection"}[10m])) > 20
        for: 0m
        labels: {severity: info}
        annotations:
          summary: "{{ $value }} prompt-injection refusals in 10 minutes"
          description: "Group the audit log (outputs/audit/audit.jsonl) by principal and query_hash to see whether one caller is probing the guard."
